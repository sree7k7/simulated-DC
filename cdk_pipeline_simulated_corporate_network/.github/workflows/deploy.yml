    name: Deploy CDK Infrastructure                                                                                                     
                                                                                                                                        
    on:                                                                                                                                 
          push:                                                                                                                         
            branches:                                                                                                                   
              - main                                                                                                                    
          workflow_dispatch:                                                                                                            
                                                                                                                                        
    env:                                                                                                                                
          AWS_REGION: us-east-1                                                                                                         
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}                                                                                 
          CUSTOMER_GATEWAY_IP: ${{ secrets.CUSTOMER_GATEWAY_IP }}                                                                       
                                                                                                                                        
    permissions:                                                                                                                        
          id-token: write                                                                                                               
          contents: read                                                                                                                
                                                                                                                                        
    jobs:                                                                                                                               
          deploy:                                                                                                                       
            name: Synth and Deploy CDK                                                                                                  
            runs-on: ubuntu-latest                                                                                                      
                                                                                                                                        
            steps:                                                                                                                      
              - name: Checkout code                                                                                                     
                uses: actions/checkout@v4                                                                                               
                                                                                                                                        
              # AWS Authentication MUST happen before CDK commands                                                                      
              - name: Configure AWS Credentials via OIDC                                                                                
                uses: aws-actions/configure-aws-credentials@v4                                                                          
                with:                                                                                                                   
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}                                                                           
                  aws-region: us-east-1                                                                                                 
                                                                                                                                        
              - name: Set up Node.js                                                                                                    
                uses: actions/setup-node@v4                                                                                             
                with:                                                                                                                   
                  node-version: '20'                                                                                                    
                                                                                                                                        
              - name: Install AWS CDK                                                                                                   
                run: npm install -g aws-cdk                                                                                             
  
              - name: Set up Python
                uses: actions/setup-python@v5
                with:
                  python-version: '3.12' 
                  cache: 'pip'
  
              - name: Install Python dependencies
                run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
  
              - name: CDK Synth
                run: cdk synth         
                env:
                  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
                  CUSTOMER_GATEWAY_IP: ${{ secrets.CUSTOMER_GATEWAY_IP }}
      
              - name: CDK Deploy
                env:
                  IMAGE_TAG: ${{ github.sha }} 
                # Because we installed CDK globally, we can just use cdk deploy
                run: cdk deploy --all --require-approval never --concurrency 5